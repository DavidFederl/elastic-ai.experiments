name: "Validate PR"
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: ["main"]

jobs:
  checks:
    name: checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # report the result of every operating system
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # pick the pr HEAD instead of the merge commit
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Prepare Devenv environment
        uses: ./.github/actions/prepare-devenv
      - name: Run checks
        # conventional commits, formatting, type check and unit tests
        run: devenv tasks run check
