name: "Validate PR"
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      os:
        description: "JSON list of the runner operating systems"
        type: string
        default: '["ubuntu-latest", "macos-latest"]'
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: ["main"]

jobs:
  checks:
    name: checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # report the result of every operating system
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os || '["ubuntu-latest", "macos-latest"]') }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # pick the pr HEAD instead of the merge commit
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Prepare Devenv environment
        uses: ./.github/actions/prepare-devenv
      - name: Run checks
        env:
          # the commit lint only checks the commits after this commit:
          # the base of the pull request or the commit before the push
          COMMIT_CHECK_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        # conventional commits, formatting, type check and unit tests
        run: devenv tasks run check
